# cargo-deny 설정. ADR 0012: just check에서 돈다.

[graph]
# [ADR 0010]: 배포하는 Windows 앱에 들어가는 것만 본다
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# 알려진 보안 취약점(RustSec)이 있거나 관리가 끊긴 crate가 들어오면 실패
version = 2

[licenses]
version = 2
# 배포하는 앱에 들어가도 되는 라이선스. 여기 없는 것이 들어오면 실패한다.
# 하나 더 넣기 전에 조건을 확인한다.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]

# Tauri가 쓰는 Mozilla 라이브러리. 고치지 않고 쓰면 앱은 MIT 그대로다.
# 배포할 때 MPL 부분의 원본 위치를 고지한다.
exceptions = [
    { name = "cssparser", allow = ["MPL-2.0"] },
    { name = "cssparser-macros", allow = ["MPL-2.0"] },
    { name = "selectors", allow = ["MPL-2.0"] },
    { name = "dtoa-short", allow = ["MPL-2.0"] },
    { name = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
# Tauri가 같은 crate의 여러 버전을 끌고 와서 경고만 하지 않는다
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io에서만 받는다
unknown-registry = "deny"
unknown-git = "deny"
