[workspace]
resolver = "3"
members = ["crates/domain", "src-tauri"]

# 모든 crate가 함께 쓰는 정보.
# [ADR 0012]: 버전 번호는 여기 한 곳에만 적는다.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Homeria/baeum-maru"

[workspace.lints.rust]
unsafe_code = "forbid"

# docs/conventions.md
[workspace.lints.clippy]
unwrap_used = "warn"
mod_module_files = "warn"
