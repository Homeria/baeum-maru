name: 잡일 (chore)
description: 빌드, CI, 의존성 업데이트, 개발 환경 설정 (브랜치 chore/…)
labels: ["chore"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 빌드·배포
        - CI (GitHub Actions)
        - 의존성 업데이트
        - 개발 환경·검사 도구 설정
        - 기타
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇을, 왜
    validations:
      required: true
  - type: checkboxes
    id: care
    attributes:
      label: 확인할 것
      options:
        - label: CI 워크플로를 바꾸면 문서만 고친 커밋에는 돌지 않는지 확인한다
        - label: 새 의존성을 넣으면 이름과 이유를 PR에 적는다
  - type: textarea
    id: more-checks
    attributes:
      label: 추가로 확인할 것
      description: 이 작업에서만 따로 확인할 것이 있으면 적어 주세요.
      value: |
        - [ ]
