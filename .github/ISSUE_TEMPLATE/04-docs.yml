name: 문서
description: README, 도메인 문서, ADR, 안내 문서를 고치거나 추가할 때 (브랜치 docs/…)
title: "[문서] "
labels: ["documentation"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 개인정보 확인
      options:
        - label: 실제 개인정보나 실제 기관 이름을 적지 않았습니다.
          required: true
  - type: input
    id: where
    attributes:
      label: 어느 문서
      placeholder: "docs/domain/GLOSSARY.md"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 틀렸거나 빠졌나요
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: 어떻게 고치면 좋을까요
