name: 리팩터링 (refactor)
description: 동작은 그대로 두고 코드 구조를 고칠 때 (브랜치 refactor/…)
labels: ["refactor"]
body:
  - type: textarea
    id: where
    attributes:
      label: 어디를
      description: 파일, 모듈, 부품 이름
      placeholder: "ui/src/features/members 의 검색 처리"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 지금 무엇이 문제인가요
      description: 읽기 어렵다, 같은 코드가 여러 곳에 있다, 테스트하기 어렵다 등
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 어떻게 바꿀 건가요
    validations:
      required: true
  - type: checkboxes
    id: keep
    attributes:
      label: 동작이 그대로인지 확인하는 방법
      options:
        - label: 기존 테스트가 그대로 통과한다
        - label: 바꾸기 전에 빠진 테스트를 먼저 추가한다
        - label: 요청 주소(API), SSE 알림, DB 구조가 바뀌지 않는다
  - type: textarea
    id: more-checks
    attributes:
      label: 추가로 확인할 것
      description: 이 작업에서만 따로 확인할 것이 있으면 적어 주세요.
      value: |
        - [ ]
  - type: textarea
    id: out
    attributes:
      label: 이번에 하지 않는 것
