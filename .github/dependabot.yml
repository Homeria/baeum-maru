# [ADR 0012]: 한 달에 한 번, 종류별로 한 PR에 묶는다.
# 묶음에는 마이너·패치만 넣고, 메이저는 패키지마다 따로 PR로 받는다.
# 보안 업데이트는 저장소 설정의 Dependabot security updates로 바로 받는다.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]
    labels: [chore]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Node(.node-version)를 올릴 때 같이 올린다
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [chore]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types: [minor, patch]
    labels: [chore]
    commit-message:
      prefix: chore
