# [ADR 0012]: 적어 둔 경로가 바뀐 때만 돌린다. 문서만 고치면 돌지 않는다.
# [ADR 0020]: just check를 작업 셋(화면, 의존성, Rust)으로 나눠 함께 돌리고, 하나가 실패하면 나머지를 멈춘다.
# [ADR 0024]: PR에서는 바뀐 파일을 보고 화면·Rust 중 필요한 작업만 돌린다.
#             main push는 셋 다 돌린다. Rust 의존성 검사는 main에서만 돈다.
name: 앱 검사

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".node-version"
      - "justfile"
      - ".github/workflows/**"
      - ".github/ci/**"
      - "!.github/workflows/site-*.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".node-version"
      - "justfile"
      - ".github/workflows/**"
      - ".github/ci/**"
      - "!.github/workflows/site-*.yml"
      - "!**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tauri가 링크하는 시스템 패키지. 캐시 키도 이 목록으로 받을 파일에서 만든다 (ADR 0022)
  TAURI_PACKAGES: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  # 바뀐 파일로 돌릴 작업을 고른다. 파일 이름 검사는 저장소 전체를 보므로 여기서 늘 돌린다.
  changes:
    name: 바뀐 파일·파일 이름
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just check-names

      # PR이 아니거나 바뀐 파일을 읽지 못하면 셋 다 돌린다. 덜 검사하는 쪽으로 틀리지 않게 한다.
      - name: 돌릴 작업 고르기
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ] \
            && git fetch --no-tags --depth=1 origin "$BASE_SHA" \
            && git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo "바뀐 파일:"
            cat "$RUNNER_TEMP/changed.txt"
            include=$(.github/ci/pick-checks.sh < "$RUNNER_TEMP/changed.txt")
          else
            echo "바뀐 파일을 보지 않고 셋 다 돌린다 (이벤트: $EVENT)"
            include=$(.github/ci/pick-checks.sh all)
          fi
          echo "돌릴 작업: $include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  # 고른 작업을 매트릭스로 묶어 함께 돌린다. 하나가 실패하면 나머지는 취소한다(fail-fast).
  check:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.include != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      # Tauri가 링크하는 시스템 패키지 (ADR 0022). 받은 .deb는 캐시에 보관해 미러에서 다시 받지 않는다.
      # 캐시 키는 이번에 받을 파일 이름(판 포함) 목록의 해시라서, Ubuntu가 새 판을 낼 때만 바뀐다.
      - name: Tauri 시스템 패키지 목록
        id: apt
        if: matrix.kind == 'rust'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install --print-uris -qq $TAURI_PACKAGES > "$RUNNER_TEMP/apt-uris.txt"
          # 주소가 아니라 파일 이름(판 포함)으로 해시한다. 러너마다 미러가 달라도 같은 키가 된다
          echo "hash=$(cut -d' ' -f2 "$RUNNER_TEMP/apt-uris.txt" | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # 키가 똑같지 않으면 직전 캐시를 꺼낸다. 판이 바뀐 파일만 미러에서 받는다.
      - name: Tauri 시스템 패키지 캐시 꺼내기
        id: apt-cache
        if: matrix.kind == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: apt-ubuntu-24.04-${{ steps.apt.outputs.hash }}
          restore-keys: apt-ubuntu-24.04-

      # 캐시는 사용자 폴더에 풀린다. apt 보관 폴더는 root 것이라 sudo로 옮긴다. 설치가 실패하면 여기서 멈춘다.
      - name: Tauri 시스템 패키지
        if: matrix.kind == 'rust'
        run: |
          shopt -s nullglob
          debs=(~/apt-debs/*.deb)
          if (( ${#debs[@]} )); then
            sudo cp "${debs[@]}" /var/cache/apt/archives/
          fi
          sudo apt-get -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true install -y $TAURI_PACKAGES

      # main에서, 키가 똑같은 캐시가 없었을 때만 저장한다. 이번에 받을 목록의 파일만 담는다.
      - name: Tauri 시스템 패키지 캐시 모으기
        if: matrix.kind == 'rust' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/apt-debs
          mkdir -p ~/apt-debs
          cut -d' ' -f2 "$RUNNER_TEMP/apt-uris.txt" | while read -r file; do
            cp "/var/cache/apt/archives/$file" ~/apt-debs/
          done

      - name: Tauri 시스템 패키지 캐시 저장
        if: matrix.kind == 'rust' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # rust-toolchain.toml의 버전과 구성 요소를 명시적으로 설치
      - name: Rust
        if: matrix.kind != 'ui'
        working-directory: app
        run: rustup toolchain install

      # 캐시는 main에서만 저장한다. PR은 읽기만 해서 PR마다 1GB씩 쌓이지 않는다.
      - if: matrix.kind == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - if: matrix.kind == 'ui'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.tools }}

      - if: matrix.kind == 'ui'
        run: just setup

      - run: just ${{ matrix.recipes }}
