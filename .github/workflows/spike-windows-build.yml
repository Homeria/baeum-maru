# 실험용: spike 03·04(Tauri 한글 입력, 다른 기기 접속)의 Windows 실행 파일을 만든다.
# 5단계 정식 CI/CD와는 별개이며, 실험이 끝나면 지운다.
#
# 실행 조건: 이 실험 폴더나 이 파일이 바뀐 커밋을 push했을 때, 또는 Actions 화면에서 직접 실행.
# (직접 실행 버튼은 이 파일이 기본 브랜치(main)에 있어야 보인다. 그래서 push로도 돌게 했다.)
name: spike-windows-build

on:
  push:
    paths:
      - "spikes/03-tauri-ime-lan/**"
      - ".github/workflows/spike-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spikes/03-tauri-ime-lan
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/03-tauri-ime-lan -> target

      - name: 빌드
        run: cargo build --release

      - name: 실행 파일 크기
        shell: pwsh
        run: "'{0:N1} MB' -f ((Get-Item target/release/spike-tauri-lan.exe).Length / 1MB)"

      - uses: actions/upload-artifact@v7
        with:
          name: spike-tauri-lan-windows
          path: spikes/03-tauri-ime-lan/target/release/spike-tauri-lan.exe
          retention-days: 14
