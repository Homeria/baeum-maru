# [ADR 0010]: 설치판(NSIS)과 완전 포터블판(ZIP)을 만든다.
# 태그면 릴리스 초안, 직접 실행이면 시험용 파일로 올린다.
name: Windows 빌드

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: 버전 읽기
        id: version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq "baeum-maru" | Select-Object -ExpandProperty version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 태그와 버전 비교
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            throw "태그 ${{ github.ref_name }}와 Cargo.toml 버전 ${{ steps.version.outputs.version }}이 다릅니다"
          }

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      - name: 빌드
        run: ui/node_modules/.bin/tauri build --bundles nsis

      # 파일 이름의 한글은 릴리스 첨부에서 깨질 수 있어 영어로 바꾼다
      - name: 설치판과 포터블판 정리
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe "out/baeum-maru_${v}_x64-setup.exe"

          # [ADR 0012]: exe 옆에 data 폴더가 있으면 포터블판
          $portable = "portable/baeum-maru"
          New-Item -ItemType Directory -Force "$portable/data" | Out-Null
          Copy-Item target/release/baeum-maru.exe "$portable/baeum-maru.exe"
          Compress-Archive -Path $portable -DestinationPath "out/baeum-maru_${v}_x64-portable.zip"
          Get-ChildItem out

      - name: 릴리스 초안
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --draft --title "${{ github.ref_name }}" --generate-notes

      - name: 시험용 파일
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: baeum-maru-${{ steps.version.outputs.version }}-test
          path: out/*
          retention-days: 7
