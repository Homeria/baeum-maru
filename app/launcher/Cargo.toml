[package]
name = "baeum-maru"
description = "배움마루 앱: 창, 대화상자, 다시 켜기, 켤 때 갈라지기. 서버는 baeum-server (ADR 0023)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Tauri 관례: 실행 파일과 이름이 겹치지 않게 _lib를 붙인다 (Windows 빌드 충돌)
[lib]
name = "baeum_maru_lib"

[dependencies]
baeum-domain = { version = "0.1.0", path = "../domain" }
baeum-server = { version = "0.1.0", path = "../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
time = { version = "0.3.55", features = ["local-offset", "macros", "serde", "serde-human-readable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
