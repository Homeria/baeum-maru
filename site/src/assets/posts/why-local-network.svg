<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">기관 안 같은 와이파이에서 대표 노트북과 다른 노트북이 연결되는 구조 (만들고 있는 구조)</title>
  <desc id="desc">만들고 있는 다중 PC 접속 구조입니다. 기관 내부망 안에서 노트북 한 대가 데이터를 보관하는 대표 PC 역할을 맡고, 다른 창구 노트북들이 외부 인터넷을 거치지 않고 대표 노트북에 바로 접속해 함께 접수합니다.</desc>
  <defs>
    <style>
      .sans { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .zoneBadge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .zoneTitle { font-size: 15px; font-weight: 700; fill: #184b66; }
      .cardTitle { font-size: 15px; font-weight: 700; fill: #16212b; }
      .cardTitleAccent { font-size: 15px; font-weight: 700; fill: #184b66; }
      .sub { font-size: 13px; fill: #455666; }
      .connLabel { font-size: 12px; font-weight: 700; fill: #184b66; }
      .outsideTitle { font-size: 14px; font-weight: 700; fill: #64748b; }
      .outsideSub { font-size: 12px; fill: #64748b; }
      .footerText { font-size: 13px; font-weight: 700; fill: #184b66; }
    </style>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#184b66" />
    </marker>
  </defs>

  <rect width="760" height="360" rx="14" fill="#f4f7f9" stroke="#d2dde6" stroke-width="1.5" />

  <!-- 기관 내부망 테두리 -->
  <rect x="24" y="20" width="538" height="278" rx="14" fill="#ffffff" stroke="#184b66" stroke-width="1.8" stroke-dasharray="7 5" />
  <rect x="42" y="36" width="96" height="24" rx="12" fill="#184b66" />
  <text x="90" y="52" text-anchor="middle" class="sans zoneBadge">기관 내부망</text>
  <text x="150" y="53" class="sans zoneTitle">같은 와이파이 안 (만들고 있는 구조)</text>

  <!-- 왼쪽: 대표 노트북 (호스트) -->
  <rect x="44" y="82" width="218" height="194" rx="12" fill="#ebf4f8" stroke="#184b66" stroke-width="1.6" />
  <text x="153" y="109" text-anchor="middle" class="sans cardTitleAccent">대표 노트북 (호스트)</text>
  <text x="153" y="129" text-anchor="middle" class="sans sub">기관에 한 대 · 내부 서버 역할</text>

  <rect x="64" y="146" width="178" height="44" rx="8" fill="#ffffff" stroke="#184b66" stroke-width="1.2" />
  <text x="153" y="173" text-anchor="middle" class="sans cardTitle">배움마루 앱</text>

  <rect x="64" y="202" width="178" height="54" rx="8" fill="#ffffff" stroke="#184b66" stroke-width="1.2" />
  <text x="153" y="225" text-anchor="middle" class="sans cardTitle">데이터 파일</text>
  <text x="153" y="244" text-anchor="middle" class="sans sub">모든 접수가 한곳에 저장</text>

  <!-- 연결 화살표 -->
  <line x1="358" y1="132" x2="270" y2="162" stroke="#184b66" stroke-width="2" marker-end="url(#arrowAccent)" />
  <line x1="358" y1="226" x2="270" y2="196" stroke="#184b66" stroke-width="2" marker-end="url(#arrowAccent)" />

  <rect x="276" y="166" width="76" height="26" rx="13" fill="#dfeef6" stroke="#b5d2e2" stroke-width="1" />
  <text x="314" y="183" text-anchor="middle" class="sans connLabel">기기 승인</text>

  <!-- 오른쪽: 다른 창구 노트북 2대 -->
  <rect x="362" y="88" width="180" height="82" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" />
  <text x="452" y="116" text-anchor="middle" class="sans cardTitle">창구 노트북 2</text>
  <text x="452" y="138" text-anchor="middle" class="sans sub">대표 노트북에 바로 접속</text>
  <text x="452" y="156" text-anchor="middle" class="sans sub">같은 데이터 파일에 저장</text>

  <rect x="362" y="188" width="180" height="82" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" />
  <text x="452" y="216" text-anchor="middle" class="sans cardTitle">창구 노트북 3</text>
  <text x="452" y="238" text-anchor="middle" class="sans sub">대표 노트북에 바로 접속</text>
  <text x="452" y="256" text-anchor="middle" class="sans sub">같은 명단 함께 조회·입력</text>

  <!-- 바깥: 외부 인터넷·서버 (차단) -->
  <rect x="584" y="88" width="152" height="182" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="660" y="128" text-anchor="middle" class="sans outsideTitle">외부 인터넷</text>
  <text x="660" y="148" text-anchor="middle" class="sans outsideTitle">외부 서버</text>

  <line x1="628" y1="176" x2="692" y2="176" stroke="#cbd5e1" stroke-width="1.5" />

  <text x="660" y="204" text-anchor="middle" class="sans outsideSub">연결하지 않음</text>
  <text x="660" y="224" text-anchor="middle" class="sans outsideSub">회원 정보는</text>
  <text x="660" y="242" text-anchor="middle" class="sans outsideSub">외부 인터넷으로</text>
  <text x="660" y="260" text-anchor="middle" class="sans outsideSub">나가지 않음</text>

  <!-- 하단 요약 바 -->
  <rect x="24" y="310" width="712" height="34" rx="8" fill="#dfeef6" />
  <text x="380" y="332" text-anchor="middle" class="sans footerText">만들고 있는 구조: 쉬는 시간에 엑셀을 합치지 않고 여러 직원이 한곳에 접수</text>
</svg>
