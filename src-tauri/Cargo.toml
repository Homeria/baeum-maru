[package]
name = "baeum-maru"
description = "배움마루 앱 (서버, DB, 창)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Tauri 관례: 실행 파일과 이름이 겹치지 않게 _lib를 붙인다 (Windows 빌드 충돌)
[lib]
name = "baeum_maru_lib"

[dependencies]
argon2 = "0.6.0"
axum = "0.8"
baeum-domain = { version = "0.1.0", path = "../crates/domain" }
getrandom = "0.4.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "time"] }
tauri = { version = "2", features = [] }
thiserror = "2"
# ADR 0015: 날짜 JSON은 "2026-11-15" 글자 (serde-human-readable), 지역 날짜는 local-offset
time = { version = "0.3.55", features = ["local-offset", "macros", "serde", "serde-human-readable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
